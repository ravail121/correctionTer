<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # For local docker, ignore RequestReadTimeout directives that are invalid in .htaccess
    # (We also disable the module to avoid parsing errors.)
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>


