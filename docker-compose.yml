services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: corrgltt_companies
      MYSQL_USER: corrgltt_companies
      MYSQL_PASSWORD: localpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: corrgltt_companies
      DB_PASS: localpass
      DB_NAME: corrgltt_companies
    volumes:
      - ./:/var/www/html
      - ./docker/apache/dev.conf:/etc/apache2/sites-available/000-default.conf:ro
    command: apache2-foreground

volumes:
  db_data:
